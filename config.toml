# RADWI Cable-Quality Analyzer — runtime configuration
# All thresholds live here so calibration edits never touch code.
# Copy this file to config.local.toml and edit, or edit in place.

[hardware]
simulate = false          # true = no hardware needed (synthetic data; useful for tests/demos)
i2c_bus = 1               # I2C bus on Pi Zero 2 W
ina219_address = "0x40"   # INA219 default address (A0,A1 -> GND)
shunt_ohms = 0.1          # INA219 breakout shunt value
max_expected_amps = 3.0   # INA219 calibration; keep <= 3.0 with a 0.1 ohm shunt
sample_rate_hz = 25.0     # acquisition rate (realistic 20-50 Hz on Pi Zero 2 W)

[gpio]                    # see WIRING_SCHEMATICS.md §4
sda = 2
scl = 3
pwr_ok = 17               # CH224K PWR_OK (polarity may vary per module)
sel0 = 22
sel1 = 23
sel2 = 24
en = 25
q1_phone_switch = 26      # P-MOSFET phone isolation (active-low)
q2_load_switch = 27       # N-MOSFET controlled-load switch (active-high)
load_pwm = 18             # e-load setpoint PWM (GPIO18 = PWM0)
status_led = 5
phone_present = 6         # optional comparator input

[ch224k]
# gpio = legacy protected wiring; manual = temporary Y-junction wiring
# (SEL0/1/2, EN and PWR_OK are not connected to the Pi).
control_mode = "manual"
pwr_ok_polarity = "high"  # "high" = PWR_OK HIGH means PD contract OK; invert if your module differs
renegotiate_wait_s = 1.5  # settle delay after changing SEL straps (VBUS dips ~0.3-1 s)
# SEL strap code for each PDO voltage (SEL2:SEL1:SEL0, SEL0 = LSB)
# verify against your module's silkscreen / datasheet truth table
sel_truth = {5 = 0b000, 9 = 0b001, 12 = 0b010, 15 = 0b011, 20 = 0b100}
verify_tolerance = 0.05   # GPIO mode: +/-5% V verification window after negotiation
# Manual mode: the phone is the load, so a lossy cable pulls the rail below
# the requested PDO (e.g. 9 V -> ~8.4 V). Verify that the rail stepped up from
# the previous voltage instead of demanding a tight relative match.
manual_verify_tolerance_v = 1.0   # accept a rail within +/-1 V of the target
manual_verify_min_step_v = 0.5    # ...and at least 0.5 V above the previous rail

[load]
max_probe_amps = 2.5      # software cap (INA219 +/-3.2A with 0.1 ohm shunt; keep margin)
pwm_freq_hz = 1000
# e-load setpoint math: V_set = 3.3 * duty * R2/(R1+R2); I = V_set / r_sense
r_sense_ohm = 0.1
divider_r1_ohm = 100000
divider_r2_ohm = 10000

[probe]
voltages = [5, 9, 12]     # manual support checks and measurement ranges
current_steps = [0.5, 1.0, 1.5, 2.0]   # e-load steps (A; automatic/GPIO mode)
manual_support_readings = 50       # VERIFICATION support samples per voltage (~2 s at 25 Hz)
manual_total_readings = 3000       # total PROBE samples divided among supported voltages
manual_min_measurement_readings = 5 # floor per supported range
step_hold_s = 5.0
transient_drop_s = 1.0    # first N seconds of a step are discarded (settling)
heat_hold_s = 60.0        # longest step held to expose self-heating (dR/dt)
heat_step_index = -1      # index into current_steps used for the heating hold
manual_hold_s = 5.0        # legacy observation time; adaptive mode uses reading counts
manual_5v_hold_s = 60.0    # legacy manual hold; adaptive mode uses manual_total_readings
recovery_hold_s = 20.0      # automatic/legacy recovery only; adaptive manual mode does not assume 5 V recovery

[session]
# Current bands measured at the phone side of the inline INA219.
# 0.000-0.009 A: no phone/load (board leakage only).
# 0.010-0.099 A: phone is connected but in its low-current/fully-charged band.
# >=0.100 A: phone is actively charging.
i_no_phone_max = 0.010    # A ; strictly below this = NO_PHONE
i_fully_charged_min = 0.010 # A ; inclusive lower bound for the low-current phone band
i_fully_charged_max = 0.10  # A ; exclusive upper bound; normally equals charge start
i_no_load = 0.05           # A ; analytics threshold for low-current dips/leakage (legacy feature setting)
i_charge_start = 0.10     # A ; inclusive lower bound for active charging
debounce_state_s = 3.0   # every normal current-band transition requires 3 s
# Legacy names retained for compatibility; SessionTracker uses debounce_state_s.
debounce_start_s = 3.0
debounce_end_s = 3.0
debounce_finish_s = 10.0  # keep logging CHARGED samples before ending charge mode
charge_timeout_s = 7200   # give up waiting for CHARGED after this
open_timeout_s = 5.0     # NO_PHONE this long while a phone is expected -> OPEN candidate

[measurement]
i_min_compute = 0.10      # A ; R features computed only above this
r_fixture_ohm = 0.0       # filled by scripts/calibrate.py (baseline: fixture + CH224K path)
length_m = 1.0            # user-provided cable length for per-metre normalization (None = unknown)
v_target_5v = 5.0
v_min_compliance_5v = 4.75
# source VBUS -> INA219 VIN- -> VIN+ -> phone gives a negative raw INA219 current
current_direction = "reverse"
# With source VBUS on VIN- and phone on VIN+, INA219 voltage() is source-side.
bus_voltage_side = "source"

[rules]
# grade limits (mOhm, per 1 m, after baseline subtraction)
grade_limits_mohm = [150, 250, 300, 500]   # A | B | C | D | F
sigma_v_excellent_mv = 5.0
sigma_v_good_mv = 15.0
sigma_v_marginal_mv = 25.0
drdt_self_heating_mohm_per_min = 5.0
interruption_warn_frac = 0.01
spike_count_warn = 10
idle_leak_ma = 20.0
nonlinear_ratio = 0.30
# Minimum resistance scale used to normalize confidence noise (ohms).
confidence_resistance_floor_ohm = 0.02

[calibration]
# One-run calibration estimate: floor = multiplier × resistance noise sigma.
confidence_floor_sigma_multiplier = 3.0

[sim]                     # simulated-cable scenario (only used with hardware.simulate = true)
r_cable_ohm = 0.21        # -> ~B/C grade cable for normal demos
calibration_reference_cable_ohm = 0.02  # short reference cable used only by calibrate --simulate
r_fixture_ohm = 0.05
heating_k = 0.0004        # R grows ~ I^2 * heating_k * dt (self-heating simulation)
v_noise = 0.004
i_noise = 0.008
# pd_blocked_above = 9   # (optional) set a number like 9 to simulate a cable that
                           # blocks CC/PD signaling above that voltage -> PD_BLOCKED verdict
short = false
open_circuit = false
intermittent = false
phone_current_a = 1.2     # simulated phone charge current
phone_plug_s = 3.0
phone_taper_s = 60.0      # battery fills -> current tapers to phone_charged_current_a
phone_charged_current_a = 0.03 # A; simulated full-phone maintenance current (0.0xx A)

[paths]
data_dir = "data"

[remote]
# Remote sync is optional and never affects local acquisition/storage.
enabled = true
device_id = "pi-zero-2w-01"
batch_size = 500
timeout_s = 10.0
max_retries = 2
retry_base_s = 1.0
sync_on_completion = true
# The uploader loads SUPABASE_URL and SUPABASE_ANON_KEY (or
# SUPABASE_PUBLISHABLE_KEY) from .env or the Pi environment.
# Never store the service_role/secret key in this file.
