<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Raspberry Pi to WiFi</title>
<style>
  body { font-family: -apple-system, sans-serif; background:#f4f4f4; margin:0; padding:2rem 1rem; }
  .card { max-width:400px; margin:0 auto; background:#fff; border-radius:12px; padding:2rem; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
  h1 { font-size:1.25rem; margin-bottom:1.5rem; text-align:center; }
  label { display:block; font-size:0.9rem; margin-bottom:0.3rem; color:#333; }
  input { width:100%; padding:0.7rem; margin-bottom:1rem; border:1px solid #ccc; border-radius:8px; box-sizing:border-box; font-size:1rem; }
  button { width:100%; padding:0.8rem; border:none; border-radius:8px; background:#0d6efd; color:#fff; font-size:1rem; }
  button:disabled { background:#93b8f0; }
  #status { margin-top:1rem; font-size:0.9rem; text-align:center; }
  .error { color:#c00; }
  .success { color:#0a0; }
</style>
</head>
<body>
  <div class="card">
    <h1>Connect Raspberry Pi to WiFi</h1>
    <form id="wifi-form">
      <label for="ssid">Network name (SSID)</label>
      <input type="text" id="ssid" name="ssid" required autocomplete="off">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="off">
      <button type="submit" id="submit-btn">Connect</button>
    </form>
    <div id="status"></div>
  </div>

<script>
document.getElementById("wifi-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  const status = document.getElementById("status");
  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  status.textContent = "Sending...";
  status.className = "";

  const formData = new FormData(this);
  try {
    const res = await fetch("/connect", { method: "POST", body: formData });
    const data = await res.json();
    status.textContent = data.message || data.error;
    status.className = data.ok ? "success" : "error";
    if (!data.ok) btn.disabled = false;
  } catch (err) {
    status.textContent = "Could not reach the Pi - it may have already switched networks.";
    status.className = "success";
  }
});
</script>
</body>
</html>
