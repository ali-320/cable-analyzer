<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connected!</title>
<style>
  body { font-family: -apple-system, sans-serif; background:#f4f4f4; margin:0; padding:2rem 1rem; }
  .card { max-width:400px; margin:0 auto; background:#fff; border-radius:12px; padding:2rem; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
  h1 { font-size:1.25rem; margin-bottom:1.5rem; text-align:center; }
  .success { color:#0a0; text-align:center; font-size:1.1rem; font-weight:bold; }
  .info { text-align:center; font-size:0.9rem; color:#555; }
  button { width:100%; padding:0.8rem; border:none; border-radius:8px; background:#198754; color:#fff; font-size:1rem; cursor:pointer; margin-top:1rem; }
</style>
</head>
<body>
  <div class="card">
    <h1>Connect Raspberry Pi to WiFi</h1>
    <p class="success">&#10003; Connected successfully!</p>
    <p class="info">Network: {{ ssid }}</p>
    <form action="/confirm" method="POST">
      <button type="submit">OK</button>
    </form>
  </div>
</body>
</html>
