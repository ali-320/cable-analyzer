<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connecting...</title>
<meta http-equiv="refresh" content="3">
<style>
  body { font-family: -apple-system, sans-serif; background:#f4f4f4; margin:0; padding:2rem 1rem; }
  .card { max-width:400px; margin:0 auto; background:#fff; border-radius:12px; padding:2rem; box-shadow:0 2px 8px rgba(0,0,0,0.08); text-align:center; }
  h1 { font-size:1.25rem; margin-bottom:1.5rem; }
  .spinner { display:inline-block; width:18px; height:18px; border:3px solid #ccc; border-top-color:#0d6efd; border-radius:50%; animation:spin 0.8s linear infinite; vertical-align:middle; margin-right:0.5rem; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .info { font-size:0.9rem; color:#555; margin-top:1rem; }
</style>
</head>
<body>
  <div class="card">
    <h1>Connect Raspberry Pi to WiFi</h1>
    <p><span class="spinner"></span> Connecting...</p>
    <p class="info">Reconnect to <b>PiHotspot</b> and wait a moment.</p>
    <p class="info">This page will refresh automatically.</p>
  </div>
</body>
</html>
